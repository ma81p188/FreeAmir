services:
    nginx:
        build:
            context: .
            dockerfile: docker/production/nginx/Dockerfile
        image: freeamir/nginx:latest
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - app-storage:/var/www/html/storage/app/public:ro
        networks:
            - freeamir
        depends_on:
            php-fpm:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://localhost/health || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    php-fpm:
        build:
            context: .
            dockerfile: docker/production/php-fpm/Dockerfile
            target: production
        image: freeamir/app:latest
        restart: unless-stopped
        environment:
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            APP_URL: '${APP_URL:-http://localhost}'
            DB_CONNECTION: sqlsrv
            DB_HOST: sqlserver
            DB_PORT: 1433
            DB_DATABASE: '${DB_DATABASE:-FreeAmir}'
            DB_USERNAME: '${DB_USERNAME:-sa}'
            DB_PASSWORD: '${DB_PASSWORD:-YourStrong!Password123}'
            CACHE_DRIVER: '${CACHE_DRIVER:-file}'
            SESSION_DRIVER: '${SESSION_DRIVER:-file}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-sync}'
        volumes:
            - app-storage:/var/www/html/storage/app/public
            - app-logs:/var/www/html/storage/logs
        networks:
            - freeamir
        healthcheck:
            test: ['CMD-SHELL', 'php-fpm-healthcheck || exit 1']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        depends_on:
            sqlserver:
                condition: service_healthy

    sqlserver:
        image: 'mcr.microsoft.com/mssql/server:2022-latest'
        restart: unless-stopped
        environment:
            ACCEPT_EULA: 'Y'
            MSSQL_SA_PASSWORD: '${DB_PASSWORD:-YourStrong!Password123}'
            MSSQL_PID: 'Express'
        ports:
            - '${DB_PORT_EXPOSE:-1433}:1433'
        volumes:
            - sqlserver-data:/var/opt/mssql
        networks:
            - freeamir
        healthcheck:
            test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s

networks:
    freeamir:
        driver: bridge

volumes:
    sqlserver-data:
        driver: local
    app-storage:
        driver: local
    app-logs:
        driver: local
